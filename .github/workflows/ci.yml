name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation and public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.16+b1a0e846e'
          core-version: '0.10.16+b1a0e846e'
      - name: Resolve dependencies
        run: moon update
      - name: Generate documentation
        run: moon doc
      - name: Verify committed package interfaces
        run: |
          moon info
          git diff --exit-code

  portable:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.16+b1a0e846e'
          core-version: '0.10.16+b1a0e846e'
      - name: Resolve dependencies
        run: moon update
      - name: Formatting
        run: moon fmt --check
      - name: All-target typecheck
        run: moon check --target all --deny-warn
      - name: Portable tests
        run: moon test --target wasm-gc --deny-warn
      - name: Examples
        run: |
          moon run examples/single-layer --target wasm-gc
          moon run examples/multi-layer --target wasm-gc
          moon run examples/reproducible --target wasm-gc

  native-linux:
    name: Native and OCI conformance (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.16+b1a0e846e'
          core-version: '0.10.16+b1a0e846e'
      - name: Install Native and OCI tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential skopeo
      - run: moon update
      - name: Native tests and build
        run: |
          moon test --target native --deny-warn
          moon build --target native --deny-warn
      - name: Build sample layout
        run: moon run cmd/moonoci --target native -- build examples/native-build/moonoci.json
      - name: MoonOCI verification
        run: |
          moon run cmd/moonoci --target native -- verify _build/ci-layout
          if moon run cmd/moonoci --target native -- verify _build/missing-layout; then
            echo "expected verification failure for missing layout"
            exit 1
          fi
      - name: Skopeo independent inspection
        run: skopeo inspect oci:_build/ci-layout:ci

  native-windows:
    name: Native (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.16+b1a0e846e'
          core-version: '0.10.16+b1a0e846e'
      - run: moon update
      - name: Native tests and build
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          moon test --target native --deny-warn
          moon build --target native --deny-warn
      - name: Native CLI smoke test
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          moon run cmd/moonoci --target native -- version
          moon run cmd/moonoci --target native -- verify _build\missing-layout && exit /b 1 || exit /b 0

  runtime-consumer:
    name: Self-hosted verifier image (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.16+b1a0e846e'
          core-version: '0.10.16+b1a0e846e'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y build-essential skopeo podman
      - run: moon update
      - run: python3 scripts/runtime_chain.py
      - run: python3 scripts/offline_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moonoci-runtime-evidence
          path: _build/runtime-*/runtime-report.json
