name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  artifact-interop:
    name: OCI consumers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: moon update
      - name: Build Native release (Linux)
        if: runner.os == 'Linux'
        run: moon build --target native --release --deny-warn
      - name: Build Native release (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          moon build --target native --release --deny-warn
      - name: Restartable delivery consumer
        run: python scripts/resume_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe
      - name: C static archive consumer (Linux)
        if: runner.os == 'Linux'
        run: python scripts/c_host_chain.py --archive _build/native/release/build/adapter/chost/chost.a
      - name: C static archive consumer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          python scripts/c_host_chain.py --archive _build/native/release/build/adapter/chost/chost.lib
      - name: Mixed release policy consumer
        run: python scripts/policy_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe
      - name: Multi-platform rollout consumer
        run: python scripts/rollout_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe
      - name: Prepare downstream release archive
        run: moon package
      - name: Isolated release consumer (Linux)
        if: runner.os == 'Linux'
        run: python scripts/downstream_chain.py --archive _build/publish/oyjh0381-moonoci-0.2.0.zip
      - name: Isolated release consumer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          python scripts/downstream_chain.py --archive _build/publish/oyjh0381-moonoci-0.2.0.zip
      - name: Independently checked transfer workload
        run: python scripts/transfer_benchmark.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --size-mib 16 --runs 1
      - run: python scripts/setup_oras.py
      - uses: actions/cache@v4
        with:
          path: _build/tools/zot-2.1.23
          key: zot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup_zot.py') }}
      - run: python scripts/setup_zot.py
      - name: Compile a MoonBit Wasm example for artifact packaging
        run: moon build examples/single-layer --target wasm --release --deny-warn
      - name: Wasm artifact consumer (Linux)
        if: runner.os == 'Linux'
        run: python scripts/wasm_artifact_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --wasm _build/wasm/release/build/examples/single-layer/single-layer.wasm --oras _build/tools/oras-1.3.6/linux_amd64/oras
      - name: Wasm artifact consumer (Windows)
        if: runner.os == 'Windows'
        run: python scripts/wasm_artifact_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --wasm _build/wasm/release/build/examples/single-layer/single-layer.wasm --oras _build/tools/oras-1.3.6/windows_amd64/oras.exe
      - name: HTTPS fixture development dependency
        run: python -m pip install cryptography==49.0.0
      - name: Private CA and hostname verification
        run: python scripts/registry_tls_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe
      - name: Registry consumer (Linux)
        if: runner.os == 'Linux'
        run: python scripts/registry_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --oras _build/tools/oras-1.3.6/linux_amd64/oras
      - name: Registry publication consumer (Linux)
        if: runner.os == 'Linux'
        run: python scripts/registry_publish_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --oras _build/tools/oras-1.3.6/linux_amd64/oras --zot _build/tools/zot-2.1.23/zot
      - name: Registry consumer (Windows)
        if: runner.os == 'Windows'
        run: python scripts/registry_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --oras _build/tools/oras-1.3.6/windows_amd64/oras.exe
      - name: Registry publication consumer (Windows)
        if: runner.os == 'Windows'
        run: python scripts/registry_publish_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --oras _build/tools/oras-1.3.6/windows_amd64/oras.exe --zot _build/tools/zot-2.1.23/zot.exe
      - name: ORAS consumer (Linux)
        if: runner.os == 'Linux'
        run: python scripts/artifact_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --oras _build/tools/oras-1.3.6/linux_amd64/oras
      - name: Reviewed retention consumer (Linux)
        if: runner.os == 'Linux'
        run: |
          python scripts/retention_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --oras _build/tools/oras-1.3.6/linux_amd64/oras
          python scripts/retention_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --oras _build/tools/oras-1.3.6/linux_amd64/oras --buffered
      - name: ORAS consumer (Windows)
        if: runner.os == 'Windows'
        run: python scripts/artifact_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --oras _build/tools/oras-1.3.6/windows_amd64/oras.exe
      - name: Reviewed retention consumer (Windows)
        if: runner.os == 'Windows'
        run: |
          python scripts/retention_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --oras _build/tools/oras-1.3.6/windows_amd64/oras.exe
          python scripts/retention_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe --oras _build/tools/oras-1.3.6/windows_amd64/oras.exe --buffered

  documentation:
    name: Documentation and public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - name: Resolve dependencies
        run: moon update
      - name: Generate documentation
        run: moon doc
      - name: Verify committed package interfaces
        run: |
          moon info
          git diff --exit-code

  portable:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - name: Resolve dependencies
        run: moon update
      - name: Formatting
        run: moon fmt --check
      - name: All-target typecheck
        run: moon check --target all --deny-warn
      - name: Portable tests
        run: moon test --target wasm-gc --deny-warn
      - name: Examples
        run: |
          moon run examples/single-layer --target wasm-gc
          moon run examples/multi-layer --target wasm-gc
          moon run examples/reproducible --target wasm-gc

  native-linux:
    name: Native and OCI conformance (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - name: Install Native and OCI tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential skopeo
      - run: moon update
      - name: Native tests and build
        run: |
          moon test --target native --deny-warn
          moon build --target native --deny-warn
      - name: Build sample layout
        run: moon run cmd/moonoci --target native -- build examples/native-build/moonoci.json
      - name: MoonOCI verification
        run: |
          moon run cmd/moonoci --target native -- verify _build/ci-layout
          if moon run cmd/moonoci --target native -- verify _build/missing-layout; then
            echo "expected verification failure for missing layout"
            exit 1
          fi
      - name: Skopeo independent inspection
        run: skopeo inspect oci:_build/ci-layout:ci

  native-windows:
    name: Native (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - run: moon update
      - name: Native tests and build
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          moon test --target native --deny-warn
          moon build --target native --deny-warn
      - name: Native CLI smoke test
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          moon run cmd/moonoci --target native -- version
          moon run cmd/moonoci --target native -- verify _build\missing-layout && exit /b 1 || exit /b 0

  runtime-consumer:
    name: Self-hosted verifier image (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y build-essential skopeo
      - run: moon update
      - run: python3 scripts/runtime_chain.py
      - run: python3 scripts/offline_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe
      - run: python3 scripts/independent_cases.py
      - run: python3 scripts/upgrade_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe
      - run: python3 scripts/nested_chain.py --binary _build/native/release/build/cmd/moonoci/moonoci.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moonoci-runtime-evidence
          path: _build/runtime-*/runtime-report.json
